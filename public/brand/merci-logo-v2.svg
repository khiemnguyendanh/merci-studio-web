<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Merci Studio</title>
  <desc id="desc">Logo Merci Studio màu xanh navy và champagne, biểu tượng chữ M trong khung vòm thanh lịch.</desc>
  <defs>
    <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8D5B7"/>
      <stop offset="0.48" stop-color="#C7A66A"/>
      <stop offset="1" stop-color="#A47C3F"/>
    </linearGradient>
  </defs>

  <!-- Emblem: the arch suggests a doorway, a camera frame and a wedding aisle. -->
  <g transform="translate(36 36)">
    <path d="M224 0C100.3 0 0 100.3 0 224v224h448V224C448 100.3 347.7 0 224 0Z" fill="#0B1D33"/>
    <path d="M224 25C114.1 25 25 114.1 25 224v199h398V224C423 114.1 333.9 25 224 25Z" fill="none" stroke="url(#champagne)" stroke-width="7"/>
    <path d="M91 335V125h57l76 139 76-139h57v210h-49V199l-64 117h-40l-64-117v136H91Z" fill="#FFFDF8"/>
    <circle cx="224" cy="365" r="6" fill="#C7A66A"/>
  </g>

  <!-- Wordmark -->
  <g fill="#0B1D33">
    <text x="565" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="183" letter-spacing="3">Merci</text>
    <text x="577" y="350" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="600" letter-spacing="20">STUDIO</text>
  </g>

  <!-- Refined signature rule -->
  <path d="M579 396H1431" stroke="url(#champagne)" stroke-width="3"/>
  <circle cx="565" cy="396" r="5" fill="#C7A66A"/>
  <circle cx="1445" cy="396" r="5" fill="#C7A66A"/>
</svg>
